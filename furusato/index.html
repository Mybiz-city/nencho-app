<style>

<body>
<header><b>ふるさと納税 限度額の目安</b><button class="b3 sm" id="menu">最初から</button></header>
<div class="wrap"><div class="prog" id="prog"></div><div id="view"></div></div>
<div class="nav" id="nav"><div><button class="b3" id="back">戻る</button><button class="b1" id="next">次へ</button></div></div>
<div id="wait"><div><div class="spin"></div><div id="waitmsg"></div><div class="note">20〜40秒ほどかかります</div></div></div>
<script src="calc.js"></script>
<script>
const $=s=>document.querySelector(s);
const track=(name,params)=>{ try{ if(typeof gtag==='function') gtag('event',name,params||{}); }catch(e){} };
const fmt=n=>(n==null||isNaN(n))?'—':Math.round(n).toLocaleString('ja-JP');
const yen=n=>fmt(n)+'円';
const toNum=v=>{const n=parseFloat(String(v??'').replace(/[^\d.\-]/g,''));return isNaN(n)?0:n};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const yenInput=(id,v,ph)=>`<div class="yen"><input type="tel" id="${id}" value="${v?fmt(v):''}" placeholder="${ph||'0'}"></div>`;
const cntSel=(id,label,hint,v)=>`<div><label>${label}</label><div class="note">${hint||''}</div><select id="${id}">${Array.from({length:10},(_,n)=>`<option value="${n}" ${(v||0)===n?'selected':''}>${n}人</option>`).join('')}</select></div>`;
const big=(key,opts,cur)=>`<div class="big">${opts.map(([v,l,sub])=>`<button type="button" data-k="${key}" data-v="${v}" class="${cur===v?'sel':''}">${l}${sub?`<small>${sub}</small>`:''}</button>`).join('')}</div>`;
const pick=key=>{const b=document.querySelector(`[data-k=${key}].sel`);return b?b.dataset.v:null};
const YEAR=new Date().getFullYear();

// ---------- 状態 ----------
let S; function fresh(){ return {mode:null, year:YEAR, salary:0, pension:0, over65:false, otherIncome:0, adjustApplies:false,
  kyuyo:null, kokuho:0, nenkin:0, shEtc:0, hasSpouse:null, spouseIncome:0, spouseOver70:false, dep:{ippan:0,tokutei:0,rojin:0,doukyo:0}, spr:[],
  per:{shogai:0,tokubetsu:0,doukyoTokubetsu:0,kafu:0,hitorioya:0,gakusei:0}, life:{new:0,old:0,care:0,pnew:0,pold:0}, jishin:0, oldLong:0, kyosai:0, iryo:0, zasson:0, loanBalance:0,
  biz:{src:'manual', mode:'annual', ytdMethod:'annualize', sales:0, exp:0, month:Math.max(1,new Date().getMonth()), ytdSales:0, ytdExp:0, remainMonthly:null, cur:Array(12).fill(null), prev:Array(12).fill(null), curSales:Array(12).fill(null), elapsed:0, method:4, aoiro:650000, vat:{mode:'unknown',acc:'komi',minashi:0.7,est:'ratio',laborPct:null,depPct:null,out:0,inn:0,out13:0,inn13:0,paidBooked:'no',food:'no',foodSalesPct:null,foodBuyPct:null}, adj:0, suiiRead:false, },
  safety:0.9}; }
S=fresh(); let steps=[], idx=0;

// ---------- 事業所得の見込み ----------
// 飲食料品の税率（テイクアウト・宅配を含む。店内飲食・酒類は10%）：2027年4月1日〜2029年3月31日は1%、それ以外は8%。年の中は月数で加重
function foodRate(year){ if(year===2027) return (3*0.08+9*0.01)/12; if(year===2028) return 0.01; if(year===2029) return (3*0.01+9*0.08)/12; return 0.08; }
function foodSplitYear(year){ return year===2027||year===2029; }
const aoiroOpts=()=>[[650000,'65万円'],[550000,'55万円'],[100000,'10万円'],[0,'なし（白色）']].map(([k,l])=>`<option value="${k}" ${S.biz.aoiro===k?'selected':''}>${l}</option>`).join('');
function bizForecast(){ const b=S.biz; let base=0,cum=0,el=0,m={},annualSales=null,annualExp=null,hasPrev=false,label='';
  if(b.src==='photo'){ const cur=b.cur.map(v=>v??0), prev=b.prev.map(v=>v??0); el=b.elapsed||0; cum=cur.slice(0,el).reduce((a,x)=>a+x,0);
    m[1]=el?cum+(cur.slice(Math.max(0,el-3),el).reduce((a,x)=>a+x,0)/Math.min(3,el))*(12-el):0; m[3]=cum+prev.slice(el,12).reduce((a,x)=>a+x,0); m[4]=el?cum*12/el:0; hasPrev=prev.slice(el).some(x=>x!==0);
    base=m[b.method]??m[4]; const f=(el&&cum)?base/cum:(el?12/el:1); const sl=b.curSales.slice(0,el).reduce((a,x)=>a+(x??0),0); if(sl) annualSales=sl*f; label=`1〜${el}月の実績から`; }
  else if(b.mode==='annual'){ base=b.sales-b.exp; annualSales=b.sales; annualExp=b.exp; label='年間の見込み'; }
  else { el=b.month||0; cum=b.ytdSales-b.ytdExp; const f=el?12/el:1; annualSales=b.ytdSales*f;
    if(b.ytdMethod==='remain'&&el<12){ const rm=b.remainMonthly!=null?b.remainMonthly:(el?cum/el:0); base=cum+rm*(12-el); annualExp=annualSales-base; label=`1〜${el}月の実績＋残り${12-el}か月の見込み`; }
    else { base=cum*f; annualExp=b.ytdExp*f; label=`1〜${el}月の実績を12か月に換算`; } }
  // 消費税の精算差益。仮受＝売上×税率。仮払は実額か、課税仕入（経費−人件費−減価償却）×税率で概算
  const v=S.biz.vat; const toTax=r=>v.acc==='komi'?r/(1+r):r; const r10=toTax(0.10), rf=toTax(foodRate(S.year)); let out=0, inn=0, estimated=false, foodWarn=false;
  const fs=v.food==='yes'?Math.min(100,v.foodSalesPct||0)/100:0, fp=v.food==='yes'?Math.min(100,v.foodBuyPct||0)/100:0;
  if(b.src==='photo'&&annualSales!=null&&annualExp==null) annualExp=annualSales-base;
  if(v.est==='actual'&&(v.out||v.out13)){
    if(v.food==='yes'&&foodSplitYear(S.year)&&b.src!=='photo'&&b.mode==='ytd'){ // 1〜3月と4月以降を分けて引き伸ばす
      const m4=Math.max(0,el-3); const f4=m4?9/m4:0; out=v.out13+v.out*f4; inn=v.inn13+v.inn*f4; if(!m4) foodWarn=true; }
    else { let f=1; if(b.src==='photo') f=(el&&cum)?base/cum:(el?12/el:1); else if(b.mode==='ytd') f=el?12/el:1; out=v.out*f; inn=v.inn*f; if(v.food==='yes'&&foodSplitYear(S.year)&&el&&el<12) foodWarn=true; } }
  else if(annualSales!=null){ out=annualSales*((1-fs)*r10+fs*rf); const nonTax=annualSales*(((v.laborPct||0)+(v.depPct||0))/100); const taxable=Math.max(0,(annualExp||0)-nonTax); inn=taxable*((1-fp)*r10+fp*rf); estimated=true; }
  let pay=0; if(v.mode==='kani')pay=out*(1-v.minashi); else if(v.mode==='niwari')pay=out*0.2; else if(v.mode==='honsoku')pay=Math.max(0,out-inn);
  let diff; if(v.mode==='unknown'){diff=0;pay=0;} else if(v.mode==='menzei')diff=v.acc==='nuki'?out-inn:0; else if(v.acc==='nuki')diff=(out-inn)-pay; else diff=v.paidBooked==='yes'?0:-pay;
  const pre=base+diff+(b.adj||0); const aoiro=Math.min(b.aoiro,Math.max(0,pre));
  return {cum,el,m,base,diff,pay,pre,aoiro,income:pre-aoiro,hasPrev,label,estimated,out,inn,annualSales,annualExp,foodWarn,unknownVat:v.mode==='unknown',simpleVat:v.est==='ratio'&&v.laborPct==null&&(v.mode==='honsoku'||(v.acc==='nuki'&&(v.mode==='kani'||v.mode==='niwari'||v.mode==='menzei'))), usesInn:v.mode==='honsoku'||v.acc==='nuki'}; }
function calcInput(){ const i={year:S.year, salary:S.salary, pension:S.pension, over65:S.over65, otherIncome:S.otherIncome, adjustApplies:S.adjustApplies,
  shaho:{kyuyo:S.kyuyo!=null?S.kyuyo:Math.round(S.salary*0.155), kokuho:S.kokuho, nenkin:S.nenkin, etc:S.shEtc}, kyosai:S.kyosai, life:S.life, jishin:S.jishin, oldLong:S.oldLong, iryo:S.iryo, zasson:S.zasson, loanBalance:S.loanBalance,
  spouseIncome:S.hasSpouse==='yes'?S.spouseIncome:null, spouseOver70:S.spouseOver70, dependents:S.dep, specialRelatives:S.spr, personal:S.per};
  if(S.mode==='biz'){ i.businessIncome=bizForecast().income; } return i; }

// ---------- 画面 ----------
function buildSteps(){
  const s=[];
  s.push({id:'mode', t:'どちらですか', html:()=>big('mode',[['salary','給与をもらっている','会社員・パート・役員など'],['biz','事業をしている','個人事業主・フリーランス']],S.mode), next:()=>{const v=pick('mode'); if(!v) throw new Error('どちらかを選んでください'); if(S.mode!==v){S.mode=v;} track('sim_start',{mode:v}); }, nextLabel:'始める'});
  if(!S.mode) return s;
  if(S.mode==='salary'){
    s.push({id:'salary', t:'今年の年収', html:()=>`<p>給与・賞与の<b>税込の総支給額</b>（1〜12月の見込み）</p>${yenInput('salary',S.salary,'例：3,500,000')}
      <details><summary>給与以外の収入もある</summary><label>年金（年間）</label>${yenInput('pension',S.pension)}<div class="chk"><input type="checkbox" id="over65" ${S.over65?'checked':''}><span>65歳以上</span></div><label>事業・不動産・副業の所得 <small>収入−経費</small></label>${yenInput('otherIncome',S.otherIncome)}</details>`,
      next:()=>{ S.salary=toNum($('#salary').value); if(!S.salary) throw new Error('年収を入れてください'); S.pension=toNum($('#pension').value); S.over65=$('#over65').checked; S.otherIncome=toNum($('#otherIncome').value); }});
  } else {
    s.push({id:'biz', t:'今年の売上と経費', html:()=>{ const b=S.biz; if(b.src==='photo'){ const f=bizForecast(); return `<p>会計ソフトの<b>推移損益（推移試算表）</b>を撮ってください。6か月以上の実績があるもの。</p><p class="note">写真は数字を読むためにAI（Anthropic社）へ送り、当事務所のサーバーには保存しません。上部の氏名・屋号は指で隠して撮っても読めます。</p>
        <label class="cam">📷 今年の推移損益を撮る<input type="file" accept="image/*,application/pdf" data-ocr="suii"></label>
        ${b.suiiRead?`<div class="ok">1〜${f.el}月の所得 <b>${yen(f.cum)}</b><br>12か月換算 <b>${yen(f.m[4])}</b></div><label class="cam" style="padding:12px;font-size:15px">📷 前年の推移損益も撮る（任意）<input type="file" accept="image/*,application/pdf" data-ocr="suii"></label>`:''}
        <label>試算表の金額は</label><div class="row">${big('amtTax',[['komi','税込'],['nuki','税抜']],b.vat.acc).replace('class="big"','class="big" style="flex-direction:row;width:100%"')}</div>
        <label>青色申告特別控除</label><select id="aoiro">${aoiroOpts()}</select>
        <p class="note noprint" style="margin-top:14px"><a href="#" id="toManual" style="color:var(--cd);font-weight:700">← 手入力に戻る</a></p>`; }
      return `${big('bizmode',[['annual','年間の見込みで入れる','今年1年の売上・経費のだいたいの額'],['ytd','今までの実績から見込む','試算表の累計を入れて残りを見込む']],b.mode)}
        <label>金額は</label><div class="row">${big('amtTax',[['komi','税込'],['nuki','税抜']],b.vat.acc).replace('class="big"','class="big" style="flex-direction:row;width:100%"')}</div>
        <div id="m_annual" style="display:${b.mode==='annual'?'block':'none'}"><label>年間の売上 <small>1〜12月の見込み</small></label>${yenInput('sales',b.sales)}<label>年間の経費 <small>仕入・人件費・家賃など全部</small></label>${yenInput('exp',b.exp)}</div>
        <div id="m_ytd" style="display:${b.mode==='ytd'?'block':'none'}"><label>試算表は何月まで</label><select id="month">${Array.from({length:11},(_,k)=>k+1).map(n=>`<option value="${n}" ${b.month===n?'selected':''}>${n}月まで</option>`).join('')}</select>
          <label>売上の累計</label>${yenInput('ytdSales',b.ytdSales)}<label>経費の累計</label>${yenInput('ytdExp',b.ytdExp)}
          <label>残りの月はどう見ますか</label>${big('ytdMethod',[['annualize','今までと同じ調子（12か月換算）'],['remain','残りの月の利益を自分で見込む']],b.ytdMethod)}
          <div id="m_remain" style="display:${b.ytdMethod==='remain'?'block':'none'}"><label>残りの月の利益（1か月あたり）</label>${yenInput('remainMonthly',b.remainMonthly,'今までの月平均')}</div></div>
        <label>青色申告特別控除</label><select id="aoiro">${aoiroOpts()}</select>
        <details ${S.salary||S.pension?'open':''}><summary>給与や年金もある</summary><label>給与の年収（税込）</label>${yenInput('salary',S.salary)}<label>年金（年間）</label>${yenInput('pension',S.pension)}<div class="chk"><input type="checkbox" id="over65" ${S.over65?'checked':''}><span>65歳以上</span></div></details>
        <p class="note noprint" style="margin-top:14px"><a href="#" id="toPhoto" style="color:var(--cd);font-weight:700">試算表の画像を読み取る（代わりに写真で入れる）</a></p>`; },
      mount:()=>{ bindOcr(); const tp=$('#toPhoto'); if(tp) tp.onclick=e=>{e.preventDefault(); S.biz.src='photo'; render();}; const tm=$('#toManual'); if(tm) tm.onclick=e=>{e.preventDefault(); S.biz.src='manual'; render();};
        document.querySelectorAll('[data-k=bizmode]').forEach(x=>x.addEventListener('click',()=>{$('#m_annual').style.display=x.dataset.v==='annual'?'block':'none';$('#m_ytd').style.display=x.dataset.v==='ytd'?'block':'none';}));
        document.querySelectorAll('[data-k=ytdMethod]').forEach(x=>x.addEventListener('click',()=>{$('#m_remain').style.display=x.dataset.v==='remain'?'block':'none';})); },
      next:()=>{ const b=S.biz; b.aoiro=+$('#aoiro').value; b.vat.acc=pick('amtTax')||'komi'; const se=$('#salary'); if(se){ S.salary=toNum(se.value); S.pension=toNum($('#pension').value); S.over65=$('#over65').checked; } if(b.src==='photo'){ if(!b.suiiRead) throw new Error('推移損益を撮るか、「手入力に戻る」で入れてください'); return; }
        b.mode=pick('bizmode'); if(!b.mode) throw new Error('どちらかを選んでください');
        if(b.mode==='annual'){ b.sales=toNum($('#sales').value); b.exp=toNum($('#exp').value); if(!b.sales) throw new Error('年間の売上を入れてください'); }
        else { b.month=+$('#month').value; b.ytdSales=toNum($('#ytdSales').value); b.ytdExp=toNum($('#ytdExp').value); b.ytdMethod=pick('ytdMethod')||'annualize'; const rm=toNum($('#remainMonthly').value); b.remainMonthly=rm||null; if(!b.ytdSales) throw new Error('売上の累計を入れてください'); } }});

function resultHtml(){

      <p class="note">節税したつもりが損をしてしまう。そんな不安がある方は一度税理士にご相談ください。</p>
      <a href="https://metis.tax/contact" onclick="track('consult_click',{mode:S.mode})" class="b1" style="display:block;text-align:center;text-decoration:none;padding:14px;border-radius:12px">メーティス税理士法人に相談する</a></div>
    <div class="card"><details><summary>計算の内訳</summary><table class="kv">${rows.map(([k,v])=>`<tr><td>${k}</td><td>${typeof v==='number'?fmt(v):v}</td></tr>`).join('')}</table><p class="note">限度額 ＝ 所得割額×20% ÷（90%−所得税率×1.021）＋2,000円</p></details>
    <button class="b3 sm noprint" style="margin-top:8px" onclick="window.print()">印刷・保存</button></div>`;
}

// ---------- 写真の読み取り ----------
function wait(on,msg){ $('#wait').style.display=on?'flex':'none'; if(msg)$('#waitmsg').textContent=msg; }
async function shrink(file){ if(!/^image\//.test(file.type)) return file; let bmp; try{ bmp=await createImageBitmap(file,{imageOrientation:'from-image'}); }catch(e){ return file; } const sc=Math.min(1,2000/Math.max(bmp.width,bmp.height)); if(sc===1&&file.size<1500000) return file; const cv=document.createElement('canvas'); cv.width=Math.round(bmp.width*sc); cv.height=Math.round(bmp.height*sc); cv.getContext('2d').drawImage(bmp,0,0,cv.width,cv.height); return await new Promise(r=>cv.toBlob(b=>r(b||file),'image/jpeg',0.9)); }
function bindOcr(){ document.querySelectorAll('[data-ocr]').forEach(inp=>inp.onchange=async()=>{ const kind=inp.dataset.ocr; for(const f0 of [...inp.files]){ wait(true,'推移損益を読み取っています'); try{ const f=await shrink(f0); const fd=new FormData(); fd.append('file',f,f0.name||'photo.jpg'); fd.append('kind',kind); fd.append('year',S.year); const res=await fetch('ocr.php',{method:'POST',body:fd}); const j=await res.json(); if(!j.ok) throw new Error(j.error||'読み取れませんでした'); applySuii(j.data); }catch(e){ wait(false); alert(e.message); } } wait(false); inp.value=''; render(); }); }
function applySuii(d){ if(d.doc_type!=='suii') throw new Error('推移損益（推移試算表）ではないようです'); const y=d.year; let which; if(y==null||y===S.year) which='cur'; else if(y===S.year-1) which='prev'; else throw new Error(`令和${y-2018}年の表です。今年か前年の表を撮ってください`);
  const inc=d.income||[]; S.biz[which]=Array.from({length:12},(_,k)=>inc[k]==null?null:Math.round(inc[k])); if(which==='cur'&&d.sales) S.biz.curSales=Array.from({length:12},(_,k)=>d.sales[k]==null?null:Math.round(d.sales[k]));
  if(which==='cur'){ let lm=d.to_month; if(!lm){ for(let m=12;m>=1;m--) if(inc[m-1]!=null){lm=m;break} } S.biz.elapsed=lm||0; S.biz.suiiRead=true; S.biz.src='photo'; } }

// ---------- 描画 ----------
let trackedResult=false;
function render(){ steps=buildSteps(); if(idx>=steps.length) idx=steps.length-1; const st=steps[idx]; if(st.last&&!trackedResult){ trackedResult=true; track('sim_result',{mode:S.mode}); } if(!st.last) trackedResult=false;
  $('#prog').innerHTML=steps.map((s,i)=>`<span class="${i<idx?'done':i===idx?'on':''}"></span>`).join('');
  $('#view').innerHTML=st.last?st.html():`<div class="card"><h1>${st.t}</h1>${st.html()}<div class="err" id="err"></div></div>`;
  document.querySelectorAll('.big button').forEach(b=>b.addEventListener('click',()=>{ b.parentElement.querySelectorAll('button').forEach(x=>x.classList.remove('sel')); b.classList.add('sel'); }));
  document.querySelectorAll('.yen:not(.pct) input').forEach(inp=>inp.addEventListener('input',()=>{ const d=inp.value.replace(/[^\d]/g,''); inp.value=d?Number(d).toLocaleString('ja-JP'):''; }));
  if(st.mount) st.mount();
  $('#nav').style.display=st.last?'none':'flex'; $('#back').style.visibility=idx>0?'visible':'hidden'; $('#next').textContent=st.nextLabel||'次へ'; window.scrollTo(0,0); }
$('#next').onclick=()=>{ const st=steps[idx]; try{ if(st.next) st.next(); const ns=buildSteps(); const i=ns.findIndex(x=>x.id===st.id); idx=i>=0?i+1:idx+1; render(); }catch(e){ $('#err').textContent=e.message; } };
$('#back').onclick=()=>{ if(idx>0){ idx--; render(); } };
$('#menu').onclick=()=>{ if(confirm('最初からやり直しますか？')){ S=fresh(); idx=0; render(); } };
render();
</script>
