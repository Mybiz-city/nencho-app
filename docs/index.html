<script>
// google.script.run の代わりに、Apps Script の doPost へ fetch で送る（Content-Type は text/plain にして事前確認なしで通す）
window.google = { script: { run: (function () {
  function mk(ok, ng) { return new Proxy({}, { get(_, name) {
    if (name === 'withSuccessHandler') return h => mk(h, ng);
    if (name === 'withFailureHandler') return h => mk(ok, h);
    return (...args) => { fetch(window.NENCHO.api, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ action: args[0], payload: args[1] || {} }) })
      .then(r => r.json()).then(j => { if (j.error) { ng && ng(new Error(j.error)); } else ok && ok(j.result); }).catch(e => ng && ng(e)); };
  } }); }
  return mk(null, null); })() } };
</script><script>(function(){
var TAX = { // 令和8年分の基準（config.sample.php と同じ値）
  salary_deduction_min: 740000, salary_deduction_flat_upto: 2190000,
  pension_deduction_under65: 600000, pension_deduction_over65: 1100000, pension_simple_upto: 1300000,
  dependent_income_max: 620000, special_relative_income_max: 1230000, special_relative_gensen_income_max: 850000,
  spouse_special_income_max: 1330000, self_income_max_for_spouse: 10000000,
  self_income_max_for_gensen: 9000000, spouse_income_max_for_gensen: 950000,
  working_student_income_max: 890000, adjust_income_threshold: 8500000
};
function cfg(){ return { year: window.NENCHO.year, tax: TAX }; }
function zenToHanDigits(s) { return String(s || '').replace(/[０-９]/g, function (c) { return String.fromCharCode(c.charCodeAt(0) - 0xFEE0); }).replace(/[／－．]/g, function (c) { return { '／': '/', '－': '-', '．': '.' }[c]; }); }
function yen(v) { if (v === null || v === undefined) return 0; var d = zenToHanDigits(v).replace(/[^\d\-]/g, ''); return parseInt(d, 10) || 0; }
function fmt(n) { return (Number(n) || 0).toLocaleString('ja-JP'); }
// 判定：年齢区分・所得・扶養区分・配偶者区分（控除額そのものは年調ソフトが計算する）

function ageAtYearEnd(iso, year) {
  if (!iso) return null; year = year || cfg().year;
  var p = iso.split('-').map(Number); return year - p[0];
}
/** 収入（種類ごと）→ 所得。incomes=[{type:'salary'|'pension'|'business'|'other', amount}] */
function incomeToShotoku(incomes, age) {
  var t = cfg().tax, salary = 0, pension = 0, other = 0;
  (incomes || []).forEach(function (i) {
    var a = yen(i.amount);
    if ((i.type || 'salary') === 'salary') salary += a; else if (i.type === 'pension') pension += a; else other += a;
  });
  var si = 0;
  if (salary > 0) si = salary < t.salary_deduction_flat_upto ? Math.max(0, salary - t.salary_deduction_min) : salaryIncomeTable(salary);
  var pi = 0;
  if (pension > 0) {
    var ded = (age !== null && age >= 65) ? t.pension_deduction_over65 : t.pension_deduction_under65;
    if (pension < t.pension_simple_upto || (age !== null && age >= 65 && pension < 3300000)) pi = Math.max(0, pension - ded);
    else pi = pensionIncomeTable(pension);
  }
  return { salary_revenue: salary, pension_revenue: pension, salary_income: si, pension_income: pi, other_income: other,
    total_income: si + pi + other, estimate: salary >= t.salary_deduction_flat_upto || pension >= t.pension_simple_upto };
}
function salaryIncomeTable(s) {
  if (s < 3600000) return Math.floor(s * 0.7) - 80000;
  if (s < 6600000) return Math.floor(s * 0.8) - 440000;
  if (s < 8500000) return Math.floor(s * 0.9) - 1100000;
  return s - 1950000;
}
function pensionIncomeTable(p) {
  if (p < 4100000) return Math.floor(p * 0.75) - 275000;
  if (p < 7700000) return Math.floor(p * 0.85) - 685000;
  if (p < 10000000) return Math.floor(p * 0.95) - 1455000;
  return p - 1955000;
}
/** 家族1人の扶養区分：一般／特定／老人／同老／年少／特定親族／対象外 */
function dependentClass(f) {
  var t = cfg().tax, age = ageAtYearEnd(f.birth), inc = incomeToShotoku(f.incomes || [], age).total_income;
  if (age === null) return '対象外';
  if (age < 16) return '年少';
  if (inc <= t.dependent_income_max) {
    if (age >= 70) { var parentLike = /父|母|祖父|祖母|義父|義母/.test(f.relation || ''); return (parentLike && f.living === 'together') ? '同老' : '老人'; }
    if (age >= 19 && age <= 22) return '特定';
    return '一般';
  }
  if (age >= 19 && age <= 22 && inc <= t.special_relative_income_max) return '特定親族';
  return '対象外';
}
function spouseClass(sp, selfIncome) {
  var t = cfg().tax, age = ageAtYearEnd(sp.birth), sh = incomeToShotoku(sp.incomes || [], age), inc = sh.total_income;
  var kubun = '対象外', gensen = '非該当';
  if (selfIncome <= t.self_income_max_for_spouse) {
    if (inc <= t.dependent_income_max) kubun = (age !== null && age >= 70) ? '老人' : '一般';
    else if (inc <= t.spouse_special_income_max) kubun = '特別';
  }
  if (selfIncome <= t.self_income_max_for_gensen && inc <= t.spouse_income_max_for_gensen) gensen = '該当';
  return { kubun: kubun, gensen: gensen, income: sh, age: age };
}
function disabilityCode(v) { return { general: '一般', special: '特別', special_together: '同特' }[v] || '非該当'; }

/** 記録全体から判定結果を作る */
function compute(r) {
  var a = r.answers || {}, t = cfg().tax;
  var selfAge = ageAtYearEnd(a.birth || (r.prev && r.prev.birth) || null);
  var selfIncomes = [{ type: 'salary', amount: a.salary || 0 }].concat(a.other_incomes || []);
  var self = incomeToShotoku(selfIncomes, selfAge);
  var out = { self: self, self_age: selfAge };
  if (a.has_spouse === 'yes') out.spouse = spouseClass(a.spouse || {}, self.total_income);
  var fam = [], counts = {}, adjustTarget = null;
  (r.family || []).forEach(function (f0) {
    var f = JSON.parse(JSON.stringify(f0));
    if (f.change && f.change.kind === 'out') { f['class'] = '除外'; fam.push(f); return; }
    if ((f.supporter || 'self') !== 'self') { f['class'] = '他者'; fam.push(f); return; }
    var cls = dependentClass(f);
    if (f.living === 'apart' && f.remit_domestic === 'no' && cls !== '対象外') { cls = '対象外'; f.note = '別居で仕送りがないため、扶養の条件（生計を一にする）を満たしません'; }
    f['class'] = cls; f.age = ageAtYearEnd(f.birth); f.income = incomeToShotoku(f.incomes || [], f.age);
    fam.push(f);
    var key = { '一般': '扶一般', '特定': '扶特定', '老人': '扶老人', '同老': '扶同老', '年少': '扶年少', '特定親族': '扶特親(源)' }[cls] || null;
    if (key === '扶特親(源)' && f.income.total_income > t.special_relative_gensen_income_max) key = '扶特親';
    if (key) counts[key] = (counts[key] || 0) + 1;
    var dis = f.disability || 'none';
    if (dis !== 'none' && cls !== '対象外') { var dk = dis === 'special' ? '扶特障' : dis === 'special_together' ? '扶同特' : '扶障害'; counts[dk] = (counts[dk] || 0) + 1; }
    if (adjustTarget === null && f.age !== null && f.age < 23 && cls !== '対象外') adjustTarget = f;
  });
  out.family = fam; out.dependent_summary = counts;
  out.adjust = null;
  if (self.salary_revenue > t.adjust_income_threshold) {
    if (adjustTarget) out.adjust = { kind: '２３歳未満 扶養親族', target: adjustTarget };
    else if ((a.self_flags || {}).disability === 'special') out.adjust = { kind: '特別障害者 本人', target: null };
  }
  out.life_ins_6man = adjustTarget !== null;
  var w = [], sf = a.self_flags || {};
  if ((sf.kafu || sf.hitorioya) && self.total_income > 5000000) w.push('寡婦・ひとり親控除は、本人の所得が500万円以下の方が対象です。今年の所得見込みが500万円を超えているため、対象外になる見込みです。');
  if (sf.student && self.total_income > t.working_student_income_max) w.push('勤労学生控除は、所得' + fmt(t.working_student_income_max) + '円以下の方が対象です。今年の見込みでは対象外です。');

  out.warnings = w;
  return out;
}

})();</script>

<body>
<header><b id="appName">メーティス 年末調整</b><span><small id="who"></small> <button type="button" id="menu" class="b3" style="font-size:13px;padding:5px 10px;display:none">…</button></span></header>
<div class="wrap"><div id="savest" style="text-align:right;font-size:12px;color:#666;margin:-6px 0 6px">入力は自動で保存されます。途中で閉じても続きから再開できます</div><div class="prog" id="prog"></div><div id="view"><div class="spin">読み込み中…</div></div></div>
<div class="nav" id="nav" style="display:none"><button class="b3" id="back">戻る</button><button class="b1" id="next">次へ</button></div>
<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<script>
const LIFF_ID = (window.NENCHO.liff_id || "");
const YEAR = (window.NENCHO.year);
let R = null;          // サーバーの記録
let steps = [], idx = 0, lineUid = null;
const $ = s => document.querySelector(s);
const view = $('#view');
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const yen = n => (Number(n) || 0).toLocaleString('ja-JP') + '円';
let TOKEN = sessionStorage.getItem('nencho_t') || '';
const DEVKEY = 'nencho_dev';
const api = (a, body) => new Promise((res, rej) => {
  google.script.run.withSuccessHandler(j => { if (!j || !j.ok) { rej(new Error((j && j.error) || 'エラー')); return; } if (j._t) { TOKEN = j._t; sessionStorage.setItem('nencho_t', TOKEN); } if (j.record) R = j.record; res(j); })
    .withFailureHandler(e => rej(new Error('通信に失敗しました。電波の良いところでやり直してください（' + (e && e.message || e) + '）')))
    .api(a, Object.assign({ _t: TOKEN }, body || {}));
});
const toB64 = f => new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(String(r.result).split(',')[1]); r.onerror = rej; r.readAsDataURL(f); });
const A = () => R.answers;
// 保存：画面はすぐ進め、サーバーへの保存は裏でまとめて送る（待ち時間をなくす）。判定結果が要る場面は saveWait を使う
const localPhotos = {}; // 送ったばかりの写真は手元の控えを表示（取り寄せを待たない）
let pendingSaves = []; let inflight = false; let flushWaiters = []; let saveErr = null;
const applyLocal = (answers, extra) => { if (answers) Object.assign(R.answers, answers); if (extra && Array.isArray(extra.family)) R.family = extra.family; if (extra && extra.consent && !R.consent_at) R.consent_at = new Date().toISOString(); };
const saveWait = async (answers, extra) => { await flush(); return api('save', Object.assign({answers, step: steps[idx]?.id}, extra || {})); };
// 判定（扶養・配偶者の区分）は手元でも計算できる（静的版に Judge.gs を同梱）。無ければサーバーの返事を待つ
const recompute = () => { if (window.judgeCompute) { try { R.computed = window.judgeCompute(R); } catch (e) {} } };
const saveSt = t => { const e=$('#savest'); if(e) e.textContent=t; };
const save = (answers, extra) => {
  R._fresh = false; applyLocal(answers, extra); recompute();
  pendingSaves.push(Object.assign({answers: answers || {}, step: steps[idx]?.id}, extra || {}));
  saveSt('保存中…'); pump();
  return Promise.resolve({ok: true});
};
// 保存以外の操作（証明書の確定・削除）も同じ列に並べ、順番に1つずつ送る。apply は手元の画面への反映
const queueCall = (call, body, apply) => { R._fresh = false; apply(); pendingSaves.push({call, body, apply}); saveSt('保存中…'); pump(); };
function mergeSaves(list){ const m = {answers: {}}; list.forEach(b => { Object.assign(m.answers, b.answers || {}); if (b.family) m.family = b.family; if (b.consent) m.consent = true; if (b.step) m.step = b.step; if (b.change) m.change = (m.change ? m.change + '、' : '') + b.change; }); return m; }
async function pump(){
  if (inflight || !pendingSaves.length) return;
  inflight = true; let batch;
  if (pendingSaves[0].call) batch = [pendingSaves.shift()]; else { batch = []; while (pendingSaves.length && !pendingSaves[0].call) batch.push(pendingSaves.shift()); }
  const send = () => batch[0].call ? api(batch[0].call, batch[0].body) : api('save', mergeSaves(batch));
  try { await send(); }
  catch (e) { try { await send(); } catch (e2) { saveErr = e2.message; showSaveErr(); } }
  // サーバーの返事で R が置き換わるので、まだ送っていない分を重ね直す
  pendingSaves.forEach(b => b.call ? b.apply() : applyLocal(b.answers, b)); if (pendingSaves.length) recompute();
  inflight = false;
  if (pendingSaves.length) pump(); else { if (!saveErr) saveSt('保存しました ✓　途中で閉じても続きから再開できます'); const w = flushWaiters; flushWaiters = []; w.forEach(f => f()); }
}
function showSaveErr(){ let b=$('#saveerr'); if(!b){ b=document.createElement('div'); b.id='saveerr'; b.style.cssText='position:fixed;bottom:0;left:0;right:0;background:#C8372D;color:#fff;padding:10px 14px;font-size:14px;z-index:99'; document.body.appendChild(b); } b.innerHTML='保存できませんでした。電波の良い場所で、この画面をもう一度開き直してください（'+esc(saveErr)+'）'; }
const flush = () => (inflight || pendingSaves.length) ? new Promise(r => flushWaiters.push(r)) : Promise.resolve();

// ---------- 和暦ヘルパー ----------
const eras = [['令',2019,5,1],['平',1989,1,8],['昭',1926,12,25],['大',1912,7,30],['明',1868,1,1]];
function wareki(iso){ if(!iso) return ''; const [y,m,d]=iso.split('-').map(Number); for(const [g,ey,em,ed] of eras){ if(y>ey||(y===ey&&(m>em||(m===em&&d>=ed)))) return `${g}${y-ey+1}年${m}月${d}日`; } return iso; }
function age(iso){ if(!iso) return null; const [y,m,d]=iso.split('-').map(Number); let a=YEAR-y; return a; }
function yearLabel(y){ for(const [g,ey] of eras){ if(y>ey||(y===ey)) { const n=y-ey+1; return `${y}年（${g}${n===1?'元':n}）`; } } return y+'年'; }
// 年・月・日を別々のリストで選ぶ（iPhoneではドラム式に、Androidでは一覧になる）。値は hidden の ISO 形式
function dateInput(id, val, opt){ opt=opt||{}; const [y,m,d]=(val||'').split('-').map(Number); const y0=opt.minYear||1920, y1=opt.maxYear||YEAR; const ys=[]; for(let i=y1;i>=y0;i--) ys.push(i);
  return `<div class="row dsel" data-id="${id}"><select class="ds_y" style="flex:2"><option value="">年</option>${ys.map(i=>`<option value="${i}" ${i===y?'selected':''}>${yearLabel(i)}</option>`).join('')}</select><select class="ds_m"><option value="">月</option>${Array.from({length:12},(_,i)=>i+1).map(i=>`<option value="${i}" ${i===m?'selected':''}>${i}月</option>`).join('')}</select><select class="ds_d"><option value="">日</option>${Array.from({length:31},(_,i)=>i+1).map(i=>`<option value="${i}" ${i===d?'selected':''}>${i}日</option>`).join('')}</select></div><input type="hidden" id="${id}" value="${esc(val||'')}"><div class="note" id="${id}_w">${val&&!opt.noAge?wareki(val)+'（'+age(val)+'歳・12/31時点）':''}</div>`; }
function bindDate(id, opt){ opt=opt||{}; const box=document.querySelector(`.dsel[data-id="${id}"]`); if(!box) return; const h=$('#'+id); const f=()=>{ const y=box.querySelector('.ds_y').value, m=box.querySelector('.ds_m').value, d=box.querySelector('.ds_d').value; h.value = (y&&m&&(d||opt.dayOptional)) ? `${y}-${String(m).padStart(2,'0')}-${String(d||1).padStart(2,'0')}` : ''; if(opt.dayOptional) h.dataset.day = d||''; const w=$('#'+id+'_w'); if(w) w.textContent = (h.value&&!opt.noAge)? wareki(h.value)+'（'+age(h.value)+'歳・12/31時点）':''; }; box.querySelectorAll('select').forEach(sl=>sl.addEventListener('change',f)); }
function bindAllDates(){ document.querySelectorAll('.dsel').forEach(b=>{ if(!b.dataset.bound){ b.dataset.bound='1'; bindDate(b.dataset.id, {noAge: b.dataset.noage==='1', dayOptional: b.dataset.dayopt==='1'}); } }); }

// ---------- 収入の入力部品 ----------
const incTypes = {salary:'給与（社員・パート・アルバイト）', pension:'年金', business:'事業・不動産（所得で記入）', other:'その他（所得で記入）'};
function incomesHtml(prefix, list){
  list = (list && list.length) ? list : [{type:'salary', amount:''}];
  return `<div id="${prefix}_box">` + list.map((it,i)=>incRow(prefix,i,it)).join('') + `</div><button type="button" class="b3" style="font-size:14px;padding:8px 12px" onclick="addInc('${prefix}')">＋ 別の種類の収入を足す</button>
  <div class="note">年間（1〜12月）の見込み額。給与は<b>年収</b>（税込の総支給額。交通費などの非課税分は除く）。年金は1年分の支給額。 <a href="#" onclick="showIncomeHelp();return false" style="color:var(--cd);font-weight:700">年収と所得の違い</a></div>`;
}
function incRow(prefix,i,it){ return `<div class="row inc" style="margin-top:6px"><select name="${prefix}_type">${Object.entries(incTypes).map(([k,v])=>`<option value="${k}" ${it.type===k?'selected':''}>${v}</option>`).join('')}</select><div class="yen"><input type="tel" name="${prefix}_amount" value="${esc(it.amount||'')}" placeholder="0"></div>${i>0?`<button type="button" class="rmx" onclick="this.closest('.inc').remove()">×</button>`:''}</div>`; }
window.rmItr = b => { const r=b.closest('.itr'); const p=r.previousElementSibling; if(p&&p.classList.contains('note')) p.remove(); r.remove(); };
window.addInc = p => { const box=$('#'+p+'_box'); box.insertAdjacentHTML('beforeend', incRow(p, box.children.length, {type:'other',amount:''})); fmtYenInputs(); };
function readIncomes(prefix){ const t=[...document.querySelectorAll(`[name=${prefix}_type]`)], a=[...document.querySelectorAll(`[name=${prefix}_amount]`)]; return t.map((s,i)=>({type:s.value, amount:Number(String(a[i].value).replace(/[^\d]/g,''))||0})); }

// ---------- 画面の定義 ----------
function buildSteps(){
  const a = A(), p = R.prev || {}, s = [];
  const hasPrev = !!(p && p.sei);
  // 0 入口
  if (!R.consent_at) s.push({id:'consent', sec:0, title:'はじめに', html:()=>`
    <p>このアプリは、<b>${esc(R.config.app_name)}</b>が年末調整の書類を作るために使います。</p>
    <ul style="padding-left:18px"><li>入力した内容と写真は、メーティス税理士法人が年末調整の計算に使い、お勤め先の会社に渡します</li><li>それ以外の目的には使いません</li><li>途中で閉じても、次に開いたとき続きから入力できます</li></ul>
    <p>提出期限：<b>${esc(R.config.deadline)}</b></p>`, next: async()=>{ await save({}, {consent:true}); }, nextLabel:'同意して始める'});
  // 1 本人
  s.push({id:'p_check', sec:1, title:'ご本人の情報', html:()=> hasPrev ? `
    <div class="prev"><b>前年の登録</b><br>${esc(p.sei)} ${esc(p.mei)}<br>フリガナ ${esc(p.sei_k)} ${esc(p.mei_k)}　性別 ${esc(p.sex||'未登録')}<br>〒${esc(p.zip)} ${esc(p.addr)}<br>生年月日 ${wareki(p.birth)}</div>
    <p>氏名・フリガナ・性別・住所に変わりはありませんか？</p>${big('p_changed',[['no','変わりない'],['yes','変わった']], a.p_changed)}` : `<p>氏名・住所などを入力してください。</p>${selfForm()}`,
    next: async()=>{ if(hasPrev){ const v=pick('p_changed'); if(!v) throw new Error('どちらかを選んでください'); await save({p_changed:v}); } else { await save(readSelf()); } }});
  if (hasPrev && a.p_changed === 'yes') s.push({id:'p_edit', sec:1, title:'新しい氏名・住所', html:()=>selfForm(), next: async()=>{ await save(readSelf(), {change:'本人の氏名・住所を変更'}); }});
  s.push({id:'p_head', sec:1, title:'世帯主', html:()=>`<p>あなたは世帯主ですか？</p>${big('head_is_self',[['yes','はい（本人）'],['no','いいえ']], a.head_is_self ?? prevHeadIsSelf())}
    <div id="headbox" style="display:${(a.head_is_self ?? prevHeadIsSelf())==='no'?'block':'none'}"><label>世帯主の氏名</label><input type="text" id="head_name" value="${esc(a.head_name ?? (p.head?.sei? p.head.sei+' '+p.head.mei:''))}" placeholder="山田 太郎"><label>あなたから見た続柄</label>${relSelect('head_rel', a.head_rel ?? ((p.head?.rel&&p.head.rel!=='本人')?p.head.rel:'夫'), headRelOpts)}<div class="note">「本人」を選ぶと、世帯主はあなた自身になります。</div></div>
    <div class="hint">住民票の世帯主欄に書かれている方です。一人暮らしなら本人です。</div>`,
    mount:()=>{ document.querySelectorAll('[data-k=head_is_self]').forEach(b=>b.addEventListener('click',()=>{$('#headbox').style.display=b.dataset.v==='no'?'block':'none';})); },
    next: async()=>{ const v=pick('head_is_self'); if(!v) throw new Error('どちらかを選んでください'); const o={head_is_self:v}; if(v==='no'){ o.head_rel=relValue('head_rel'); if(o.head_rel==='本人'){ o.head_is_self='yes'; } else { o.head_name=$('#head_name').value.trim(); if(!o.head_name) throw new Error('世帯主の氏名を入れてください'); } } await save(o); }});
  s.push({id:'p_salary', sec:1, title:'今年の給与収入', html:()=>`<p>今年（1〜12月）にお勤め先から受ける給与・賞与の<b>見込み額</b>を入れてください。</p>${(R.prev_answers&&R.prev_answers.salary)?`<div class="prev">前年にアプリで入力した見込み：${yen(R.prev_answers.salary)}</div>`:(p.salary_total?`<div class="prev">前年の給与・賞与の実績：${yen(p.salary_total)}<br><span class="note">同じくらいなら、そのまま「次へ」。変わるなら直してください。</span></div>`:'')}<div class="yen"><input type="tel" id="salary" value="${esc(a.salary || (R.prev_answers&&R.prev_answers.salary) || p.salary_total || '')}" placeholder="例：3,500,000"></div>
    <div class="hint">税込の総支給額です。交通費などの非課税分は除きます。給与明細の「総支給額」を12か月分足した目安で構いません。1円単位でなくても大丈夫です。</div>`,
    next: async()=>{ const v=Number($('#salary').value.replace(/[^\d]/g,'')); if(!v) throw new Error('金額を入れてください'); await save({salary:v}); }});
  s.push({id:'p_other', sec:1, title:'給与以外の収入', html:()=>`<p>今年、給与以外の収入（年金、事業、不動産、副業など）はありますか？</p>${big('has_other_income',[['no','ない'],['yes','ある'],['unknown','あるが、金額の見積もりが難しい']], a.has_other_income)}
    <div id="oibox" style="display:${a.has_other_income==='yes'?'block':'none'}">${incomesHtml('oi', (a.other_incomes||[]).length? a.other_incomes : [{type:'pension',amount:''}])}</div>
    <div id="oiunk" class="hint" style="display:${a.has_other_income==='unknown'?'block':'none'}">年末調整は給与分で行い、給与以外の所得はご自身で確定申告してください（給与以外の所得が20万円を超える方は、もともと確定申告が必要です）。</div>`,
    mount:()=>{ document.querySelectorAll('[data-k=has_other_income]').forEach(b=>b.addEventListener('click',()=>{$('#oibox').style.display=b.dataset.v==='yes'?'block':'none'; $('#oiunk').style.display=b.dataset.v==='unknown'?'block':'none';})); },
    next: async()=>{ const v=pick('has_other_income'); if(!v) throw new Error('どれかを選んでください'); await save({has_other_income:v, other_incomes: v==='yes'? readIncomes('oi'): []}); }});
  s.push({id:'p_emp2', sec:1, title:'ほかの勤務先', html:()=>`<p>今、2か所以上で働いていますか？</p>${big('other_employer',[['no','いいえ'],['yes','はい']], a.other_employer)}
    <div id="e2box" style="display:${a.other_employer==='yes'?'block':'none'}"><p>「扶養控除等申告書」はどちらに出しますか？<span class="note">主たる勤め先（1か所）にしか出せません。</span></p>${big('other_employer_decl',[['here','この会社'],['other','別の勤務先']], a.other_employer_decl)}</div>
    <div class="hint">別の勤務先に出す場合、この会社では年末調整をせず、ご自身で確定申告をします。</div>`,
    mount:()=>{ document.querySelectorAll('[data-k=other_employer]').forEach(b=>b.addEventListener('click',()=>{$('#e2box').style.display=b.dataset.v==='yes'?'block':'none';})); },
    next: async()=>{ const v=pick('other_employer'); if(!v) throw new Error('どちらかを選んでください'); const d=v==='yes'? pick('other_employer_decl'):'here'; if(v==='yes'&&!d) throw new Error('どちらに出すか選んでください'); await save({other_employer:v, other_employer_decl:d}); }});
  if (a.other_employer_decl==='other') { s.push({id:'p_otsu', sec:5, title:'この会社では年末調整をしません', html:()=>`<p>扶養控除等申告書を別の勤務先に出す場合、この会社では年末調整を行いません（給与は乙欄で計算します）。</p><p>ご自身で確定申告をしてください。この画面で「提出」を押すと、その旨が事務所に伝わります。</p><div class="hint">入力を間違えた場合は「戻る」で直せます。</div>`, nextLabel:'この内容で提出する', next: async()=>{ waitOn('提出しています'); try{ await flush(); await api('submit'); } finally { waitOff(); } }}); s.push({id:'r_done', sec:5, title:'提出しました', html:()=>`<div class="fin"><div class="ok">✓</div><h2>送信しました</h2><p class="note">この会社では年末調整を行いません。確定申告の時期にご相談ください。</p></div>`, last:true}); return s; }
  s.push({id:'p_flags', sec:1, title:'障害・寡婦・ひとり・勤労', html:()=>{ const f=a.self_flags||{}; return `<p>障害者・寡婦・ひとり親・勤労学生の4つは、当てはまる方だけ控除が増える項目です。<b>当てはまるものがあれば</b>選んでください。</p><p class="note">ほとんどの方は当てはまりません。その場合は何も選ばず「次へ」。</p>
    <label>障害者</label><select id="f_dis"><option value="none">該当しない</option><option value="general" ${f.disability==='general'?'selected':''}>障害者</option><option value="special" ${f.disability==='special'?'selected':''}>特別障害者（重度）</option></select>
    <div id="f_dis_box" style="display:${f.disability&&f.disability!=='none'?'block':'none'}"><label>手帳の種類・等級</label><input type="text" id="f_dis_text" value="${esc(f.disability_text||'')}" placeholder="例：身体障害者手帳 3級"><div class="note">あとで手帳の写真を撮る画面があります</div></div>
    <div class="chk"><input type="checkbox" id="f_kafu" ${f.kafu?'checked':''}><span>寡婦（夫と死別・離別し、扶養する家族がいる。所得500万円以下）</span></div>
    <div class="chk"><input type="checkbox" id="f_hitori" ${f.hitorioya?'checked':''}><span>ひとり親（子を一人で育てている。所得500万円以下）</span></div>
    <div class="chk"><input type="checkbox" id="f_student" ${f.student?'checked':''}><span>勤労学生（学生で年収163万円以下）</span></div>`; },
    mount:()=>{ $('#f_dis').addEventListener('change',()=>{$('#f_dis_box').style.display=$('#f_dis').value!=='none'?'block':'none';}); },
    next: async()=>{ const sf={disability:$('#f_dis').value, disability_text:$('#f_dis_text').value.trim(), kafu:$('#f_kafu').checked, hitorioya:$('#f_hitori').checked, student:$('#f_student').checked}; save({self_flags:sf}); const inc=((R.computed||{}).self||{}).total_income||0; if((sf.kafu||sf.hitorioya)&&inc>5000000) toast('寡婦・ひとり親控除は、本人の所得が500万円以下の方が対象です。今年の見込みでは対象外になる見込みです。'); else if(sf.student&&inc>890000) toast('勤労学生控除は、所得89万円以下の方が対象です。今年の見込みでは対象外です。'); }});
  if ((a.self_flags||{}).disability && a.self_flags.disability!=='none') s.push(photoStep('p_dis_photo',1,'障害者手帳の写真','手帳の表面（氏名・手帳の種類・等級が分かる面）を撮ってください。読み取った種類と等級は「障害・寡婦・ひとり・勤労」の欄に入ります。','techo'));
  s.push({id:'p_since', sec:1, title:'今年の在籍', html:()=>`<p>今年の1月1日から、この会社に在籍していますか？</p>${big('since_jan',[['yes','はい'],['no','いいえ']], a.since_jan)}
    <div id="pibox" style="display:${a.since_jan==='no'?'block':'none'}"><p style="margin-top:14px">今年の1月以降に、前の勤務先から給与の支払いがありましたか？</p>${big('prev_income',[['no','なかった'],['yes','あった']], a.prev_income)}
    <div class="hint">「あった」場合は、前の勤務先の源泉徴収票を次の画面で撮ります。手元にない場合は、前の勤務先に発行を頼んでください。支払いが前年中で終わっていれば「なかった」です。</div></div>`,
    mount:()=>{ document.querySelectorAll('[data-k=since_jan]').forEach(b=>b.addEventListener('click',()=>{$('#pibox').style.display=b.dataset.v==='no'?'block':'none';})); },
    next: async()=>{ const v=pick('since_jan'); if(!v) throw new Error('どちらかを選んでください'); const pi = v==='no' ? pick('prev_income') : 'no'; if(v==='no'&&!pi) throw new Error('前の勤務先からの支払いの有無を選んでください'); await save({since_jan:v, prev_income:pi, joined: pi==='yes'?'yes':'no'}); }});
  if (a.prev_income==='yes') s.push(photoStep('p_join_photo',1,'前の勤務先の源泉徴収票','源泉徴収票の全体が入るように撮ってください。','gensen'));

  // 2 配偶者
  const sp = a.spouse || {}, psp = p.spouse;
  s.push({id:'s_has', sec:2, title:'配偶者', html:()=>`<p>配偶者（夫・妻）はいますか？<span class="note">今年12月31日時点</span></p>${big('has_spouse',[['no','いない'],['yes','いる']], a.has_spouse ?? (psp?'yes':undefined))}${psp?`<div class="prev"><b>前年の登録</b><br>${esc(psp.sei)} ${esc(psp.mei)}　${wareki(psp.birth)}</div>`:''}`,
    next: async()=>{ const v=pick('has_spouse'); if(!v) throw new Error('どちらかを選んでください'); const o={has_spouse:v}; if(v==='yes'&&!a.spouse&&psp) o.spouse={name:psp.sei+' '+psp.mei, kana:psp.sei_k+' '+psp.mei_k, birth:psp.birth, living: psp.nonres?'abroad':'together', addr:''}; await save(o); }});
  if (a.has_spouse==='yes') {
    s.push({id:'s_info', sec:2, title:'配偶者の情報', html:()=>`<label>氏名</label><input type="text" id="sp_name" value="${esc(sp.name||'')}" placeholder="山田 花子"><label>フリガナ</label><input type="text" id="sp_kana" value="${esc(sp.kana||'')}" placeholder="ヤマダ ハナコ"><label>生年月日</label>${dateInput('sp_birth',sp.birth)}
      <label>住まい</label><select id="sp_living"><option value="together" ${sp.living==='together'?'selected':''}>同居</option><option value="apart" ${sp.living==='apart'?'selected':''}>別居（国内）</option><option value="abroad" ${sp.living==='abroad'?'selected':''}>国外に住んでいる</option></select>
      <div id="sp_addr_box" style="display:${sp.living&&sp.living!=='together'?'block':'none'}"><label>住所</label><input type="text" id="sp_addr" value="${esc(sp.addr||'')}"><div id="sp_remit_box" style="display:${sp.living==='abroad'?'block':'none'}"><label>今年の送金額（年間）</label><div class="yen"><input type="tel" id="sp_remit" value="${esc(sp.remit||'')}"></div><div class="note">親族関係書類と送金関係書類が必要です。あとで事務所から連絡します。</div></div></div>
      <label>あなたから見て</label><select id="sp_rel"><option ${sp.relation==='妻'?'selected':''}>妻</option><option ${sp.relation==='夫'?'selected':''}>夫</option></select>
      <label>障害者</label><select id="sp_dis" onchange="document.getElementById('sp_dis_box').style.display=this.value==='none'?'none':'block'"><option value="none">該当しない</option><option value="general" ${sp.disability==='general'?'selected':''}>障害者</option><option value="special" ${sp.disability==='special'?'selected':''}>特別障害者（別居）</option><option value="special_together" ${sp.disability==='special_together'?'selected':''}>特別障害者（同居）</option></select>
      <div id="sp_dis_box" style="display:${sp.disability&&sp.disability!=='none'?'block':'none'}"><label>手帳の種類・等級</label><input type="text" id="sp_dis_text" value="${esc(sp.disability_text||'')}" placeholder="例：身体障害者手帳 3級"><div class="note">あとで手帳の写真を撮る画面があります</div></div>`,
      mount:()=>{ $('#sp_living').addEventListener('change',()=>{ const v=$('#sp_living').value; $('#sp_addr_box').style.display=v!=='together'?'block':'none'; $('#sp_remit_box').style.display=v==='abroad'?'block':'none'; }); },
      next: async()=>{ const o=Object.assign({}, sp, {name:$('#sp_name').value.trim(), kana:$('#sp_kana').value.trim(), birth:$('#sp_birth').value, living:$('#sp_living').value, addr:$('#sp_addr').value.trim(), remit:$('#sp_remit').value, relation:$('#sp_rel').value, disability:$('#sp_dis').value, disability_text:$('#sp_dis_text').value.trim()}); if(!o.name||!o.birth) throw new Error('氏名と生年月日を入れてください'); await save({spouse:o}); }});
    s.push({id:'s_income', sec:2, title:'配偶者の今年の収入', html:()=>`<p><b>${esc(sp.name||'配偶者')}</b>さんの今年（1〜12月）の<b>年収</b>を、種類ごとに入れてください。<span class="note">収入がなければ 0</span></p>${incomesHtml('spi', sp.incomes)}
      <div class="hint">給与だけなら年収136万円以下で配偶者控除、207万円以下で配偶者特別控除の対象です（あなたの年収が1,195万円以下の場合）。判定はこちらで行います。</div>`,
      next: async()=>{ const o=Object.assign({}, sp, {incomes: readIncomes('spi')}); if(window.judgeCompute) save({spouse:o}); else await saveWait({spouse:o}); const c=R.computed.spouse; if(c) toast(c.kubun==='対象外'?'配偶者控除の対象外です（収入が上限を超えています）': c.kubun==='特別'?'配偶者特別控除の対象です':'配偶者控除の対象です'); }});
  }

  // 3 家族
  const fam = R.family || [];
  const prevFam = (p.family||[]);
  s.push({id:'f_list', sec:3, title:'扶養する家族（配偶者以外）', html:()=>famList(), mount:()=>bindFam(), next: async()=>{ const miss=(R.family||[]).filter(f=>!(f.incomes&&f.incomes.length)); if(miss.length) throw new Error(miss.map(f=>f.name).join('、')+' の「編集」を開いて、今年の収入を入れてください（0円でも保存）'); await save({f_done:true}); }});

  // 家族・配偶者の障害者手帳
  const disPeople = [...(a.has_spouse==='yes'&&(a.spouse||{}).disability&&a.spouse.disability!=='none'? [a.spouse.name]:[]), ...fam.filter(f=>f.disability&&f.disability!=='none').map(f=>f.name)];
  if (disPeople.length) s.push(photoStep('f_dis_photo',3,'ご家族の障害者手帳','次の方の手帳の表面を1人ずつ撮ってください：'+disPeople.map(esc).join('、'),'techo'));
  const abroadPeople = [...(a.has_spouse==='yes'&&(a.spouse||{}).living==='abroad'? [a.spouse.name]:[]), ...fam.filter(f=>f.living==='abroad'&&!isOut(f)).map(f=>f.name)];
  if (abroadPeople.length) s.push(photoStep('f_abroad_photo',3,'国外に住む家族の書類','次の方について、親族関係書類（戸籍の附票や出生証明書など）と送金関係書類（送金の控えやカード利用明細）を撮ってください：'+abroadPeople.map(esc).join('、')+'。外国語の書類は訳文も必要です。手元にないものは、後日会社に提出してください。','kokugai'));

  // 4 証明書
  s.push(certStep('c_life', '生命保険・医療保険・個人年金', '生命保険料控除証明書（はがき・PDFを印刷したもの）はありますか？', 'life'));
  s.push(certStep('c_jishin', '地震保険', '地震保険料控除証明書はありますか？', 'jishin'));
  s.push({id:'c_shaho', sec:4, title:'自分で払った社会保険料', html:()=>`<p>給与から天引きされていない社会保険料（国民年金・国民健康保険など）を、今年ご自分で払いましたか？<span class="note">家族の分を払った場合も含みます</span></p>${big('has_shaho',[['no','払っていない'],['yes','払った']], a.has_shaho)}
    <div id="shbox" style="display:${a.has_shaho==='yes'?'block':'none'}"><div id="sh_rows">${(a.shaho&&a.shaho.length?a.shaho:[{}]).map(shRow).join('')}</div><button type="button" class="b3" style="font-size:14px;padding:8px 12px" onclick="document.getElementById('sh_rows').insertAdjacentHTML('beforeend', shRow({}))">＋ 行を足す</button>
    <div class="hint">国民年金は「控除証明書」の金額を入れ、次の画面で証明書の写真も撮ってください。国民健康保険・介護保険は証明書不要で、払った金額を入れます。</div></div>`,
    mount:()=>{ document.querySelectorAll('[data-k=has_shaho]').forEach(b=>b.addEventListener('click',()=>{$('#shbox').style.display=b.dataset.v==='yes'?'block':'none';})); },
    next: async()=>{ const v=pick('has_shaho'); if(!v) throw new Error('どちらかを選んでください'); const rows=[...document.querySelectorAll('#sh_rows .shr')].map(r=>({type:r.querySelector('[name=sh_type]').value, who:r.querySelector('[name=sh_who]').value.trim(), amount:Number(r.querySelector('[name=sh_amt]').value.replace(/[^\d]/g,''))||0})).filter(r=>r.amount>0); await save({has_shaho:v, shaho: v==='yes'? rows: []}); }});
  if (a.has_shaho==='yes' && (a.shaho||[]).some(r=>r.type==='kokumin_nenkin')) s.push(photoStep('c_kn_photo',4,'国民年金の控除証明書','証明書の全体が入るように撮ってください。','cert', 'kokumin'));
  s.push(certStep('c_kyosai', '小規模企業共済・iDeCo', '小規模企業共済やiDeCo（個人型確定拠出年金）の掛金払込証明書はありますか？<span class="note">給与天引きのiDeCoは不要</span>', 'kyosai'));
  s.push(certStep('c_jutaku', '住宅ローン控除（2年目以降）', '住宅ローン控除を、今年で2年目以降として受けますか？<span class="note">1年目の方は確定申告になります</span>', 'jutaku', '金融機関の「年末残高証明書」と、税務署から届いた「住宅借入金等特別控除申告書」の両方を撮ってください。'));

  // 5 確認
  s.push({id:'r_cmp', sec:5, title:'内容の確認', html:()=>compareHtml(), nextLabel:'この内容で提出する', next: async()=>{ waitOn('提出しています'); try{ await flush(); await api('submit'); } finally { waitOff(); } }});
  s.push({id:'r_done', sec:5, title:'提出しました', html:()=>`<div class="fin"><div class="ok">✓</div><h2>提出が完了しました</h2><p>${R.submitted_at? new Date(R.submitted_at).toLocaleString('ja-JP'):''}</p><p class="note">内容を直したいときは、もう一度このアプリを開いて進めば、再提出できます。<br>控除証明書の原本は、会社の指示に従って提出してください。</p></div>`, last:true});
  return s;
}

function shRow(r){ return `<div class="row shr" style="margin-top:6px"><select name="sh_type"><option value="kokumin_nenkin" ${r.type==='kokumin_nenkin'?'selected':''}>国民年金</option><option value="kokuho" ${r.type==='kokuho'?'selected':''}>国民健康保険</option><option value="kaigo" ${r.type==='kaigo'?'selected':''}>介護保険</option><option value="other" ${r.type==='other'?'selected':''}>その他</option></select><input type="text" name="sh_who" value="${esc(r.who||'本人')}" placeholder="誰の分"><div class="yen"><input type="tel" name="sh_amt" value="${esc(r.amount||'')}" placeholder="年額"></div></div>`; }

function big(key, opts, cur){ return `<div class="big">${opts.map(([v,l])=>`<button type="button" data-k="${key}" data-v="${v}" class="${cur===v?'sel':''}">${l}</button>`).join('')}</div>`; }
function pick(key){ const b=document.querySelector(`[data-k=${key}].sel`); return b? b.dataset.v: null; }
function prevHeadIsSelf(){ const p=R.prev||{}; if(!p.head||!p.head.sei) return undefined; if(p.head.rel==='本人') return 'yes'; if(p.head.sei===p.sei && p.head.mei===p.mei) return 'yes'; return 'no'; }
function selfForm(){ const a=A(), p=R.prev||{}; return `<label>氏名</label><input type="text" id="s_name" value="${esc(a.name ?? (p.sei? p.sei+' '+p.mei:''))}" placeholder="山田 太郎"><label>フリガナ</label><input type="text" id="s_kana" value="${esc(a.kana ?? (p.sei_k? p.sei_k+' '+p.mei_k:''))}" placeholder="ヤマダ タロウ"><label>性別</label><select id="s_sex"><option value="">選んでください</option><option ${(a.sex ?? p.sex)==='男'?'selected':''}>男</option><option ${(a.sex ?? p.sex)==='女'?'selected':''}>女</option></select><label>生年月日</label>${dateInput('s_birth', a.birth ?? p.birth)}<label>郵便番号</label><input type="tel" id="s_zip" value="${esc(a.zip ?? p.zip ?? '')}" placeholder="590-0000"><label>住所（来年1月1日に住んでいる所）</label><input type="text" id="s_addr" value="${esc(a.addr ?? p.addr ?? '')}" placeholder="大阪府○○市○○町1-2-3 ○○マンション101"><div class="note">姓と名の間は空白を入れてください。</div>`; }
function readSelf(){ const o={name:$('#s_name').value.trim(), kana:$('#s_kana').value.trim(), sex:$('#s_sex').value, birth:$('#s_birth').value, zip:$('#s_zip').value.trim(), addr:$('#s_addr').value.trim()}; if(!o.name||!o.kana||!o.sex||!o.birth||!o.addr) throw new Error('氏名・フリガナ・性別・生年月日・住所を入れてください'); return o; }

// ---------- 家族 ----------
const relOpts = ['子','父','母','祖父','祖母','兄','姉','弟','妹','孫','義父','義母','その他'];
const headRelOpts = ['本人','夫','妻','父','母','祖父','祖母','子','兄','姉','弟','妹','義父','義母','その他'];
function relSelect(id, val, opts){ const other = val && !opts.includes(val) ? val : ''; return `<select id="${id}" onchange="document.getElementById('${id}_o').style.display=this.value==='その他'?'block':'none'">${opts.map(o=>`<option ${ (other? o==='その他' : val===o) ?'selected':''}>${o}</option>`).join('')}</select><input type="text" id="${id}_o" value="${esc(other)}" placeholder="続柄を入力" style="display:${other?'block':'none'};margin-top:6px">`; }
function relValue(id){ const v=$('#'+id).value; return v==='その他' ? ($('#'+id+'_o').value.trim()||'その他') : v; }

const outReasons = {job:'就職した', marriage:'結婚した', independent:'独立した', abroad_out:'国外へ転出した', other_support:'別の方の扶養に移った', other:'その他'};
const isOut = f => f.change && f.change.kind==='out';
function famFromPrev(){ return (R.prev.family||[]).map(f=>({name:f.sei+' '+f.mei, kana:f.sei_k+' '+f.mei_k, relation:f.rel, birth:f.birth, living: f.nonres?'abroad':(f.addr&&R.prev.addr&&f.addr!==R.prev.addr?'apart':'together'), addr: f.addr||'', supporter: f.supporter||'self', supporter_name: f.supporter_name||'', supporter_rel: f.supporter_rel||'', disability: f.dis==='一般'?'general':f.dis==='特別'?'special':f.dis==='同特'?'special_together':'none', incomes: (age(f.birth)!==null&&age(f.birth)<16)?[{type:'salary',amount:0}]:[], prev_income: f.income||0, prev_kubun: f.kubun||''})); }
function famList(){

  const cls = c => ({'一般':'扶養控除','特定':'特定扶養','老人':'老人扶養','同老':'同居老親','年少':'16歳未満','特定親族':'特定親族特別控除','対象外':'扶養の対象外','他者':'他の方の扶養','除外':'扶養から出た'})[c]||c;

    if (isOut(f)) return `<div class="it" style="opacity:.6"><div><b>${esc(f.name)}</b> <span class="note">${esc(f.relation)}</span><span class="tag">扶養から出た ${esc(ch.ym||'')}</span><small>${esc(outReasons[ch.reason]||'')}</small></div><button type="button" class="b3" data-edit="${i}">編集</button></div>`;

    return `<div class="it"><div><b>${esc(f.name)}</b> <span class="note">${esc(f.relation)}・${wareki(f.birth)}</span>${need?'<span class="tag r">今年の収入が未入力</span>':`<span class="tag ${c.class==='対象外'?'r':''}">${cls(c.class)}</span>`}${chTag}<small>${minor? '16歳未満（収入 0円）' : (f.incomes||[]).length? ((f.incomes||[]).filter(x=>x.amount>0).map(x=>incTypes[x.type].split('（')[0]+' '+yen(x.amount)).join('、')||'収入 0円') : (f.prev_kubun? '前年：'+f.prev_kubun : '')}${c.note?'<br><span style="color:var(--red)">'+esc(c.note)+'</span>':''}</small></div>${need?`<button type="button" class="b1" style="flex:0 0 auto;padding:8px 10px;font-size:14px" data-zero="${i}">0円</button> `:''}<button type="button" class="b3" data-edit="${i}">${need?'入力':'編集'}</button></div>`; }).join('')}</div>
  ${fam.length<10? `<button type="button" class="b2" id="f_add" style="width:100%">＋ 家族を追加する${fam.length>=5?'（6人目以降）':''}</button>`:''}
  ${fam.length? '<p class="note">今年、扶養に入った方・扶養から出た方は「編集」で日付を入れてください。</p>': '<p class="note">扶養する家族がいなければ、そのまま「次へ」</p>'}`;
}
function bindFam(){
  if (!(R.family||[]).length && (R.prev&&R.prev.family||[]).length && !A().f_imported) { api('save',{family:famFromPrev(), answers:{f_imported:true}}).then(()=>render()); return; }
  document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>famEdit(Number(b.dataset.edit)));
  document.querySelectorAll('[data-zero]').forEach(b=>b.onclick=async()=>{ const fam=[...R.family]; fam[Number(b.dataset.zero)].incomes=[{type:'salary',amount:0}]; if(window.judgeCompute) save({}, {family:fam}); else await saveWait({}, {family:fam}); render(); });
  const add=$('#f_add'); if(add) add.onclick=()=>famEdit(-1);
}
function famEdit(i){
  const f = i>=0 ? R.family[i] : {name:'',kana:'',relation:'子',birth:'',living:'together',addr:'',supporter:'self',disability:'none',incomes:[], change:{kind:'in', ym:'', day:'', reason:''}};
  $('#nav').style.display='none';
  view.innerHTML = `<div class="card"><div class="sec">家族</div><h1>${i>=0?'家族の情報を編集':'家族を追加'}</h1>
    <label>氏名</label><input type="text" id="fn" value="${esc(f.name)}" placeholder="山田 一郎"><label>フリガナ</label><input type="text" id="fk" value="${esc(f.kana)}" placeholder="ヤマダ イチロウ"><label>続柄</label><select id="fr">${relOpts.map(r=>`<option ${f.relation===r?'selected':''}>${r}</option>`).join('')}</select><label>生年月日</label>${dateInput('fb',f.birth)}

    <div id="fa_box" style="display:${f.living!=='together'?'block':'none'}"><label>住所</label><input type="text" id="fa" value="${esc(f.addr||'')}"><div id="fm_box" style="display:${f.living==='abroad'?'block':'none'}"><label>今年の送金額</label><div class="yen"><input type="tel" id="fm" value="${esc(f.remit||'')}"></div></div></div>
    <div id="fr_box" style="display:${f.living==='apart'?'block':'none'}"><label>生活費の仕送りをしていますか</label><select id="frd"><option value="yes" ${f.remit_domestic==='yes'?'selected':''}>している（定期的に）</option><option value="no" ${f.remit_domestic==='no'?'selected':''}>していない</option></select><div class="yen" style="margin-top:6px"><input type="tel" id="frda" value="${esc(f.remit_domestic_amount||'')}" placeholder="年間のおおよその額（任意）"></div><div class="note">別居の家族は、生活費を送っている（生計を一にしている）ことが扶養の条件です。学費・病院代の負担も含みます。</div></div>
    <label>今年（1〜12月）の年収</label>${f.prev_kubun?`<div class="prev">前年の区分：${esc(f.prev_kubun)}${f.prev_income?'　所得 '+yen(f.prev_income):''}</div>`:''}
    <div class="big" style="margin:6px 0"><button type="button" id="fz0" class="${(f.incomes||[]).length&&!(f.incomes||[]).some(x=>x.amount>0)?'sel':''}">年収は0円</button><button type="button" id="fz1" class="${(f.incomes||[]).some(x=>x.amount>0)?'sel':''}">年収を入力する</button></div>

    <label>障害者</label><select id="fd" onchange="document.getElementById('fd_box').style.display=this.value==='none'?'none':'block'"><option value="none">該当しない</option><option value="general" ${f.disability==='general'?'selected':''}>障害者</option><option value="special" ${f.disability==='special'?'selected':''}>特別障害者（別居）</option><option value="special_together" ${f.disability==='special_together'?'selected':''}>特別障害者（同居）</option></select>

    <div id="fch_in" style="display:${f.change?.kind==='in'?'block':'none'}"><label>きっかけ（任意）</label><select id="fch_rin"><option value="">選ばない</option>${Object.entries(inReasons).map(([k,v])=>`<option value="${k}" ${f.change?.reason===k?'selected':''}>${v}</option>`).join('')}</select></div>

    <div id="fch_death" style="display:${f.change?.kind==='death'?'block':'none'}"><div class="note">今年は扶養に入れられます。その他の手続きは事務所で行いますので、日付だけで結構です。</div></div></div>
    <div class="err" id="ferr"></div>
    <div class="btns">${i>=0&&!f.prev_kubun?'<button type="button" class="b3" id="fdel">削除</button>':''}<button type="button" class="b2" id="fcancel">やめる</button><button type="button" class="b1" id="fsave">保存</button></div></div>`;
  bindAllDates();

  $('#fz1').onclick=()=>{ $('#fz1').classList.add('sel'); $('#fz0').classList.remove('sel'); $('#fi_wrap').style.display='block'; fmtYenInputs(); };
  $('#fch').onchange=()=>{ const v=$('#fch').value; $('#fch_box').style.display=v?'block':'none'; $('#fch_in').style.display=v==='in'?'block':'none'; $('#fch_out').style.display=v==='out'?'block':'none'; $('#fch_death').style.display=v==='death'?'block':'none'; };

  $('#fcancel').onclick=()=>render();
  if ($('#fdel')) $('#fdel').onclick=async()=>{ if(!confirm('この家族を削除しますか？')) return; const fam=[...R.family]; fam.splice(i,1); const ex={family:fam, change:'家族を削除: '+f.name}; if(window.judgeCompute) save({}, ex); else await saveWait({}, ex); render(); };

function prevAmount(cat){ const am=(R.prev&&R.prev.amounts)||{}; const lab={life_new:'一般（新）',life_old:'一般（旧）',kaigo:'介護医療',nenkin_new:'個人年金（新）',nenkin_old:'個人年金（旧）',jishin:'地震',old_songai:'旧長期',kyosai:'共済・iDeCo',zandaka1:'年末残高'}; const m={life:['life_new','life_old','kaigo','nenkin_new','nenkin_old'], jishin:['jishin','old_songai'], kyosai:['kyosai'], jutaku:['zandaka1']}; const parts=(m[cat]||[]).filter(k=>am[k]>0).map(k=>lab[k]+' '+yen(am[k])); return parts.join('、'); }
function prevCerts(cat){ return (R.prev_certs||[]).filter(c=>c.cat===cat); }
function camHtml(kind,cat){ return `<label class="cam" style="margin-top:8px">📷 カメラで撮る／写真を選ぶ<input type="file" accept="image/*" data-cam="${kind}" data-cat="${cat||''}"></label>`; }
function waitOn(msg){ let w=$('#waitbox'); if(!w){ w=document.createElement('div'); w.id='waitbox'; w.style.cssText='position:fixed;inset:0;background:rgba(255,255,255,.85);z-index:1000;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;padding:30px'; document.body.appendChild(w); } w.innerHTML=`<div style="width:46px;height:46px;border:5px solid #ddd;border-top-color:var(--c);border-radius:50%;animation:spin 1s linear infinite"></div><b style="font-size:18px">${msg}</b><div class="note" id="waitsec">0秒</div><div class="note">そのままお待ちください。写真の読み取りは通常20〜40秒かかります（保存だけなら数秒）。90秒を超えても終わらなければ、電波の良い所でやり直してください。</div>`; document.querySelectorAll('.nav button').forEach(b=>b.disabled=true); let n=0; w._t=setInterval(()=>{ n++; const e=$('#waitsec'); if(e) e.textContent=n+'秒'; },1000); }

// ---------- 画面の描画 ----------
async function render(){

  if (idx >= steps.length) idx = steps.length-1;
  if (steps[idx].id==='r_cmp' && !R._fresh) { view.innerHTML='<div class="card"><p>入力内容を確認しています…</p></div>'; await flush(); R._fresh=true; steps=buildSteps(); }

  const secs=['はじめに','ご本人','配偶者','家族','証明書','確認'];
  $('#prog').innerHTML = secs.map((n,i)=>`<span class="${i<st.sec?'done':i===st.sec?'on':''}" title="${n}"></span>`).join('');
  view.innerHTML = `<div class="card"><div class="sec">${secs[st.sec]}</div><h1>${st.title}</h1>${st.html()}<div class="err" id="err"></div></div>`;
  document.querySelectorAll('.big button').forEach(b=>b.addEventListener('click',()=>{ b.parentElement.querySelectorAll('button').forEach(x=>x.classList.remove('sel')); b.classList.add('sel'); }));
  if (st.mount) st.mount();
  fmtYenInputs(); bindAllDates();
  $('#nav').style.display = st.last? 'none':'flex';
  $('#back').style.visibility = idx>0? 'visible':'hidden';
  $('#next').textContent = st.nextLabel || '次へ';
  window.scrollTo(0,0);
}
$('#next').onclick = async()=>{ const st=steps[idx]; $('#next').disabled=true; try{ await st.next(); const ns=buildSteps(); const i=ns.findIndex(x=>x.id===st.id); idx = i>=0 ? i+1 : idx; render(); }catch(e){ $('#err').textContent=e.message; } $('#next').disabled=false; };

$('#menu').onclick = ()=>{ const m=document.createElement('div'); m.style.cssText='position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:20;display:flex;align-items:flex-end'; m.innerHTML=`<div class="card" style="width:100%;margin:0;border-radius:14px 14px 0 0"><h2>メニュー</h2><button type="button" class="b2" style="width:100%;margin-bottom:8px" id="m_top">最初の画面に戻る（入力は残る）</button><button type="button" class="b3" style="width:100%;margin-bottom:8px;color:var(--red)" id="m_reset">今年の入力をすべて消してやり直す</button><button type="button" class="b3" style="width:100%;margin-bottom:8px" id="m_unbind">このスマホの登録を解除する</button><button type="button" class="b3" style="width:100%" id="m_close">閉じる</button></div>`; document.body.appendChild(m);
  m.querySelector('#m_close').onclick=()=>m.remove(); m.onclick=e=>{ if(e.target===m) m.remove(); };
  m.querySelector('#m_top').onclick=()=>{ m.remove(); idx=0; render(); };
  m.querySelector('#m_unbind').onclick=async()=>{ if(!confirm('このスマホからの自動ログインをやめます。次に開くときは、会社に新しい初回番号を発行してもらう必要があります。よろしいですか？')) return; await api('unbind'); try{ localStorage.removeItem(DEVKEY); }catch(e){} sessionStorage.removeItem('nencho_t'); TOKEN=''; m.remove(); loginView('このスマホの登録を解除しました'); };
  m.querySelector('#m_reset').onclick=async()=>{ if(!confirm('今年に入力した内容と写真をすべて消します。前年の登録は残ります。よろしいですか？')) return; await api('reset'); m.remove(); idx=0; toast('消しました。最初から入力できます'); render(); }; };
async function shrink(file){ // 送る前に長辺1600pxのJPEGに縮める（通信量と読み取り費用を抑える）
  if(!/^image\//.test(file.type)) return file; let bmp; try{ bmp=await createImageBitmap(file,{imageOrientation:'from-image'}); }catch(e){ bmp=await createImageBitmap(file); } const s=Math.min(1, 1600/Math.max(bmp.width,bmp.height)); if(s===1&&file.size<1500000) return file;
  const cv=document.createElement('canvas'); cv.width=Math.round(bmp.width*s); cv.height=Math.round(bmp.height*s); cv.getContext('2d').drawImage(bmp,0,0,cv.width,cv.height);
  return await new Promise(r=>cv.toBlob(b=>r(b||file),'image/jpeg',0.88)); }
function fmtYenInputs(){ document.querySelectorAll('.yen input').forEach(inp=>{ if(inp.dataset.fmt) return; inp.dataset.fmt='1'; const f=()=>{ const d=inp.value.replace(/[^\d]/g,''); inp.value = d? Number(d).toLocaleString('ja-JP'): ''; }; inp.addEventListener('input',f); f(); }); }
function showIncomeHelp(){ const m=document.createElement('div'); m.style.cssText='position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:20;display:flex;align-items:center;justify-content:center;padding:20px'; m.innerHTML=`<div class="card" style="max-width:420px;margin:0"><h2>年収と所得の違い</h2>
  <p><b>年収</b>＝1年間に受け取った給与の合計（税金や社会保険料を引く前の金額）。源泉徴収票の「支払金額」です。</p>
  <p><b>所得</b>＝年収から「給与所得控除」を引いた金額。扶養に入れるかどうかは、この所得で判定します。</p>
  <table class="cmp"><tr><th>年収</th><th>所得</th><th>判定</th></tr><tr><td>136万円以下</td><td>62万円以下</td><td>扶養・配偶者控除の対象</td></tr><tr><td>207万円以下</td><td>133万円以下</td><td>配偶者特別控除の対象</td></tr></table>
  <p class="note">このアプリには<b>年収</b>を入れてください。所得はこちらで計算します。</p><div class="btns"><button type="button" class="b1" id="ihclose">閉じる</button></div></div>`; document.body.appendChild(m); m.querySelector('#ihclose').onclick=()=>m.remove(); m.onclick=e=>{ if(e.target===m) m.remove(); }; }
function toast(m){ const t=document.createElement('div'); t.textContent=m; t.style.cssText='position:fixed;top:60px;left:50%;transform:translateX(-50%);background:#333;color:#fff;padding:10px 16px;border-radius:10px;z-index:9;font-size:14px;max-width:90%'; document.body.appendChild(t); setTimeout(()=>t.remove(),3500); }

// ---------- 入口 ----------
function loginView(msg){
  $('#nav').style.display='none';
  view.innerHTML = `<div class="card"><h1>登録コードを入力</h1><p>会社または事務所から配られた<b>登録コード</b>を入れてください。このスマホで初めて開くときだけ必要です。</p><input type="tel" id="code" inputmode="numeric" placeholder="例：0302000001" style="font-size:24px;letter-spacing:.08em;text-align:center"><div class="note" style="text-align:center">数字だけ（10桁）。LINEやメールで届いたコードを貼り付けてください。</div><div id="lpin" style="display:none"><label>初回番号（会社から渡された6桁）</label><input type="tel" id="pin" inputmode="numeric" placeholder="例：123456" style="font-size:24px;letter-spacing:.2em;text-align:center"><div class="note">このスマホで初めて開くときに必要です。次回からは自動で入れます。番号は他の人に見せないでください。</div></div><div class="err" id="lerr">${esc(msg||'')}</div><div class="btns"><button class="b1" id="login">始める</button></div><p class="note" style="margin-top:14px">コードが分からないときは、お勤め先かメーティス税理士法人にお尋ねください。</p></div>`;
  bindAllDates();
  $('#login').onclick = async()=>{ $('#login').disabled=true; try{ const j=await api('login',{code:$('#code').value, pin:$('#pin').value, line_user_id: lineUid}); if(j.need_pin){ $('#lpin').style.display='block'; $('#lerr').textContent='本人確認のため、会社から渡された初回番号（6桁）を入れてください'; $('#pin').focus(); } else { if(j.dev){ try{ localStorage.setItem(DEVKEY, j.dev); }catch(e){} } start(); } }catch(e){ $('#lerr').textContent=e.message; } const lb=$('#login'); if(lb) lb.disabled=false; };
}
function start(){
  $('#who').textContent = (R.answers.name || (R.prev&&R.prev.sei? R.prev.sei+' '+R.prev.mei:'')) + ' さん'; $('#menu').style.display='inline-block';
  idx = 0;
  steps = buildSteps();
  if (R.status==='submitted') idx = steps.findIndex(s=>s.id==='r_cmp');
  else if (R.last_step) { const i=steps.findIndex(s=>s.id===R.last_step); if(i>=0) idx=Math.min(i+1, steps.length-1); }
  render();
}
(async()=>{
  try{
    if (LIFF_ID && window.liff) { try{ await liff.init({liffId:LIFF_ID}); if(!liff.isLoggedIn()){ liff.login(); return; } const prof=await liff.getProfile(); lineUid=prof.userId; const j=await api('line_login',{line_user_id:lineUid}); if(j.known){ start(); return; } }catch(e){ console.warn('LIFF', e); } }
    if (TOKEN) { try{ await api('load'); start(); return; }catch(e){ TOKEN=''; sessionStorage.removeItem('nencho_t'); } }
    let dev=''; try{ dev=localStorage.getItem(DEVKEY)||''; }catch(e){}
    if (dev) { const j=await api('device_login',{dev}); if(j.known){ start(); return; } if(j.retired){ view.innerHTML='<div class="card"><p>退職された方は、この会社の年末調整の対象外です。源泉徴収票をもとにご自身で確定申告をしてください。</p></div>'; return; } try{ localStorage.removeItem(DEVKEY); }catch(e){} }
    loginView();
  }catch(e){ view.innerHTML = `<div class="card"><p class="err">${esc(e.message)}</p></div>`; }
})();
// 写真は必要になったときに取り寄せる
new MutationObserver(()=>{ document.querySelectorAll('img[data-photo]:not([data-loading])').forEach(async img=>{ img.dataset.loading='1'; try{ if(localPhotos[img.dataset.photo]){ img.src=localPhotos[img.dataset.photo]; return; } const j=await api('photo',{f:img.dataset.photo}); img.src=j.data; }catch(e){ img.alt='（写真を表示できません）'; } }); }).observe(view,{childList:true,subtree:true});
